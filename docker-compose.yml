x-app: &app
  build: .
  environment:
    APP_ENV: local
    APP_DEBUG: "false"
    APP_TIMEZONE: UTC
    DB_CONNECTION: sqlite
    QUEUE_CONNECTION: redis
    CACHE_STORE: file
    SESSION_DRIVER: array
    LOG_CHANNEL: stderr
    REDIS_CLIENT: predis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  volumes:
    - .:/app
    # Keep the dependencies installed in the image rather than the host's.
    - /app/vendor
  depends_on:
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/_healthcheck') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--tries=1"]

  worker-ride-distance:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--queue=ride_distance_checks", "--tries=1"]

  worker-ride-weather:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--queue=ride_weather_checks", "--tries=1"]
