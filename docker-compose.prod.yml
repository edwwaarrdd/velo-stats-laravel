# A separate project name, so the production images and containers never
# collide with the development ones and both can stay built side by side.
name: velo-stats-laravel-prod

services:
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "2"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/_healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: UTC
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      QUEUE_CONNECTION: redis
      CACHE_STORE: file
      SESSION_DRIVER: array
      LOG_CHANNEL: stderr
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    deploy:
      resources:
        limits:
          cpus: "4"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
